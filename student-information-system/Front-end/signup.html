<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Create an account — M&E Lights and Sounds</title>
<link rel="stylesheet" href="css/style.css" />
<style>
  .auth-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 20px 32px; border-bottom: 1px solid var(--border-subtle);
  }
  .auth-wrap {
    min-height: calc(100vh - 73px);
    display: flex; align-items: center; justify-content: center;
    padding: 40px 20px;
  }
  .auth-card { width: 100%; max-width: 420px; padding: 40px; }
  .auth-card h1 { font-size: 24px; margin: 8px 0 8px; }
  .auth-card p.lead { color: var(--text-muted); font-size: 14px; margin: 0 0 28px; }
  .hint { font-size: 12px; color: var(--text-faint); margin-top: -12px; margin-bottom: 18px; }
</style>
</head>
<body>

<div class="auth-header">
  <div class="brand">
    <div class="brand-mark">M&E</div>
    <div class="brand-name">M&E Lights <span>And Sounds</span></div>
  </div>
  <a href="index.html" class="text-muted" style="font-size:13px;">&larr; Back to site</a>
</div>

<div class="auth-wrap">
  <div class="card auth-card">
    <span class="eyebrow">Get started</span>
    <h1>Create your account</h1>
    <p class="lead">Set up an account to book packages, track your event date, and get your booking reference — no more group chats. Already booking with us? <a href="login.html" style="color:var(--violet); font-weight:600;">Log in.</a></p>

    <form onsubmit="event.preventDefault(); window.location.href='dashboard.html';">
      <div class="field-row">
        <div class="field">
          <label for="first-name">First name</label>
          <input id="first-name" type="text" placeholder="Juan" required />
        </div>
        <div class="field">
          <label for="last-name">Last name</label>
          <input id="last-name" type="text" placeholder="Dela Cruz" required />
        </div>
      </div>
      <div class="field">
        <label for="email">Email address</label>
        <input id="email" type="email" placeholder="juandelacruz@gmail.com" required />
      </div>
      <div class="field">
        <label for="phone">Phone number</label>
        <input id="phone" type="tel" placeholder="09123456789" required />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" placeholder="Enter your password" required />
      </div>
      <p class="hint">Use at least 8 characters, with a number and a symbol.</p>
      <button type="submit" class="btn btn-primary btn-block">Create account &rarr;</button>
    </form>
  </div>
</div>

</body>
</html>
